server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Загрузка работ и аватаров: лимит API — MAX_HOMEWORK_UPLOAD_MB (по умолчанию 450 МБ).
  client_max_body_size 460m;

  location /api/ {
    proxy_pass http://api:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_request_buffering off;
  }

  location = /health {
    proxy_pass http://api:8788/health;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: навигация внутри клиента, index.html не кэшируется.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
